<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuel Radar Zambia</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
<header style="display:flex; align-items:center; gap:14px; padding:12px 16px; background:#0a1931;">
  <img src="logo.png" alt="Fuel Radar" style="width:58px; height:58px; border-radius:14px; box-shadow:0 2px 8px rgba(0,0,0,0.3);">
  <div>
    <h1 style="margin:0; font-size:22px;">Fuel Radar Zambia</h1>
    <p style="margin:2px 0 0; font-size:13px; opacity:0.8;">Live fuel availability in Lusaka & Zambia</p>
  </div>
</header>

<div id="map"></div>

<div class="container">
  <div class="filters">
    <button class="active" onclick="filterFuel('all')">All</button>
    <button onclick="filterFuel('available')">Available</button>
    <button onclick="filterFuel('low')">Low</button>
    <button onclick="filterFuel('out')">No Fuel</button>
  </div>

  <div id="station-list"></div>
  
  <div class="add-report">
    <h3>Report Fuel Status</h3>
    <select id="report-station"></select>
    <select id="report-status">
      <option value="available">✅ Available</option>
      <option value="low">⚠️ Low / Queue</option>
      <option value="out">❌ No Fuel</option>
    </select>
    <button onclick="submitReport()">Submit Report</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
